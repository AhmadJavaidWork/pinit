name: Build and Release

on:
  push:
    tags:
      - 'v*' # Triggers only when you push a version tag like v1.0.0

jobs:
  release:
    name: Build for ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-linux
            os: ubuntu-latest
            artifact_name: pinit-linux-x86_64.tar.gz
            asset_cmd: tar -czf pinit-linux-x86_64.tar.gz -C zig-out/bin .

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Zig
        uses: jetsung/setup-zig@v0.0.4
        with:
          version: "0.16.0"

      - name: Build Optimized Binary
        run: zig build -Doptimize=ReleaseFast -Dtarget=${{ matrix.target }}

      - name: Archive Binary
        run: ${{ matrix.asset_cmd }}

      - name: Upload Binaries to Release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.artifact_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

